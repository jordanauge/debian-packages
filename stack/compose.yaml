name: debian
services:
  reprepro:
    build: .
    image: synaxe-debian-repository:local
    user: "${REPO_UID:-1003}:${REPO_GID:-1003}"
    volumes:
      - /home/gromit/debian-repository:/repository
    restart: "no"
  nginx:
    image: nginx:stable-alpine
    ports:
      - "172.17.0.1:8591:80"
    volumes:
      - /home/gromit/debian-repository/public:/srv/public:ro
      - /home/gromit/debian-repository/private:/srv/private:ro
      - /home/gromit/debian-repository/auth:/etc/nginx/auth:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
