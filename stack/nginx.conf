server {
    listen 80;
    server_name _;
    root /srv/public;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(private/)?(conf|db)/ {
        deny all;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location /private/ {
        auth_basic "Synaxe private archive";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        alias /srv/private/;
    }
}
